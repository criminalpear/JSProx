name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ultraviolet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ultraviolet/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      # The browser suite loads live sites (example.com, httpbin.org).
      - run: npm test
