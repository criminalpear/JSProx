<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Console</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --border: #3c3c3c;
    --text: #d4d4d4;
    --input: #1e1e1e;
    --accent: #569cd6;
    --err: #f48771;
    --warn: #dcdcaa;
    --dim: #808080;
    --result: #b5cea8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .hint { color: var(--dim); font-size: 12px; }
  header button {
    margin-left: auto;
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  header button:hover { border-color: var(--accent); }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line { padding: 2px 0; border-bottom: 1px solid #2a2a2a; }
  .line .marker { color: var(--dim); user-select: none; margin-right: 6px; }
  .in .marker { color: var(--accent); }
  .out .marker { color: var(--result); }
  .out { color: var(--result); }
  .log { color: var(--text); }
  .error { color: var(--err); }
  .warn { color: var(--warn); }
  .info { color: var(--accent); }
  .inputbar {
    display: flex;
    align-items: flex-start;
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .inputbar .marker { color: var(--accent); padding: 10px 6px 10px 12px; user-select: none; }
  #cmd {
    flex: 1;
    background: transparent;
    color: var(--text);
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px 10px 0;
    line-height: 1.4;
    min-height: 40px;
    max-height: 200px;
  }
</style>
</head>
<body>
<header>
  <h1>JS Console</h1>
  <span class="hint">Enter = run &nbsp;·&nbsp; Shift+Enter = newline &nbsp;·&nbsp; ↑/↓ = history</span>
  <button id="clear">Clear</button>
</header>
<div id="output"></div>
<div class="inputbar">
  <span class="marker">&gt;</span>
  <textarea id="cmd" rows="1" autofocus spellcheck="false" placeholder="type JavaScript and press Enter…"></textarea>
</div>

<script>
(function () {
  const output = document.getElementById('output');
  const cmd = document.getElementById('cmd');
  const clearBtn = document.getElementById('clear');
  const history = [];
  let histIdx = -1;

  function el(cls, text) {
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    d.textContent = text;
    return d;
  }

  function print(cls, marker, text) {
    const line = document.createElement('div');
    line.className = 'line ' + cls;
    if (marker) {
      const m = document.createElement('span');
      m.className = 'marker';
      m.textContent = marker;
      line.appendChild(m);
    }
    const span = document.createElement('span');
    span.textContent = text;
    line.appendChild(span);
    output.appendChild(line);
    output.scrollTop = output.scrollHeight;
  }

  function stringify(v) {
    if (typeof v === 'string') return v;
    if (v instanceof Error) return v.stack || (v.name + ': ' + v.message);
    if (typeof v === 'function') return v.toString();
    try {
      return JSON.stringify(v, function (k, val) {
        if (typeof val === 'function') return '[Function: ' + (val.name || 'anonymous') + ']';
        if (val === undefined) return '[undefined]';
        return val;
      }, 2);
    } catch (e) {
      return String(v);
    }
  }

  // Route console.* into our panel too.
  ['log', 'info', 'warn', 'error'].forEach(function (fn) {
    const orig = console[fn].bind(console);
    console[fn] = function (...args) {
      print(fn === 'log' ? 'log' : fn, '', args.map(stringify).join(' '));
      orig(...args);
    };
  });

  window.addEventListener('error', function (e) {
    print('error', '', 'Uncaught ' + (e.error ? (e.error.stack || e.error) : e.message));
  });
  window.addEventListener('unhandledrejection', function (e) {
    print('error', '', 'Uncaught (in promise) ' + stringify(e.reason));
  });

  function run(code) {
    print('in', '>', code);
    if (code.trim()) {
      history.push(code);
      histIdx = history.length;
    }
    let result;
    try {
      // Indirect eval → runs in global scope, so `var`/functions persist across commands.
      result = (0, eval)(code);
      if (result instanceof Promise) {
        print('out', '<', 'Promise { <pending> }');
        result.then(
          function (v) { print('out', '<', stringify(v)); },
          function (e) { print('error', '<', stringify(e)); }
        );
      } else {
        print('out', '<', stringify(result));
      }
    } catch (err) {
      print('error', '<', err instanceof Error ? (err.stack || err.name + ': ' + err.message) : stringify(err));
    }
  }

  function autosize() {
    cmd.style.height = 'auto';
    cmd.style.height = Math.min(cmd.scrollHeight, 200) + 'px';
  }

  cmd.addEventListener('input', autosize);

  cmd.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const code = cmd.value;
      if (!code.trim()) return;
      cmd.value = '';
      autosize();
      run(code);
    } else if (e.key === 'ArrowUp' && cmd.selectionStart === 0) {
      if (histIdx > 0) {
        e.preventDefault();
        histIdx--;
        cmd.value = history[histIdx];
        autosize();
      }
    } else if (e.key === 'ArrowDown' && cmd.selectionStart === cmd.value.length) {
      if (histIdx < history.length - 1) {
        e.preventDefault();
        histIdx++;
        cmd.value = history[histIdx];
        autosize();
      } else if (histIdx === history.length - 1) {
        e.preventDefault();
        histIdx = history.length;
        cmd.value = '';
        autosize();
      }
    }
  });

  clearBtn.addEventListener('click', function () {
    output.innerHTML = '';
    cmd.focus();
  });

  print('info', '', 'JS console ready. Runs in this page. Try: document.title  or  1+1  or  console.log("hi")');
  cmd.focus();
})();
</script>
</body>
</html>
